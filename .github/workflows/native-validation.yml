name: Validate native dependencies
on:
  pull_request:
    paths:
      - apps/mobile/package.json
      - apps/mobile/ios/**
      - pnpm-lock.yaml
      - .github/workflows/native-validation.yml
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    # SDK 57's recommended Apple compiler; do not inherit an older default.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Resolve native lock on the pinned runner
        working-directory: apps/mobile/ios
        run: |
          pod --version
          xcodebuild -version
          pod install --no-repo-update
      - name: Preserve native lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alvo-native-lock
          path: apps/mobile/ios/Podfile.lock
          retention-days: 3
      - name: Compile iOS simulator without signing
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace EsdrasApp.xcworkspace -scheme EsdrasApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/alvo-native-build CODE_SIGNING_ALLOWED=NO build > /tmp/alvo-native-build.log 2>&1 || { grep -nE 'error:|fatal error:|failed:' /tmp/alvo-native-build.log | head -60; tail -35 /tmp/alvo-native-build.log; exit 1; }
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alvo-native-build-log
          path: /tmp/alvo-native-build.log
          retention-days: 3
      - name: Require the native lock to be committed
        run: git diff --exit-code -- apps/mobile/ios/Podfile.lock
