name: Validate platform
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @alvo/web exec next typegen
      - run: corepack pnpm test
      - run: corepack pnpm typecheck
  builds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [web, lp, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - if: matrix.target == 'web'
        run: node scripts/with-qa-env.mjs corepack pnpm build:cloudflare:web
      - if: matrix.target == 'web'
        run: corepack pnpm qa:cloudflare-runtime
      - if: matrix.target == 'web'
        name: Load public production configuration
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const ts = require('typescript');
          const source = fs.readFileSync('apps/web/wrangler.jsonc', 'utf8');
          const parsed = ts.parseConfigFileTextToJson('wrangler.jsonc', source);
          if (parsed.error) throw new Error('Invalid Wrangler configuration');
          const entries = Object.entries(parsed.config.vars).filter(([key]) => key.startsWith('NEXT_PUBLIC_'));
          for (const [key, value] of entries) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('Invalid public build value');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          JS
      - if: matrix.target == 'web'
        name: Build and verify production-configured Worker
        run: |
          corepack pnpm build:cloudflare:web
          corepack pnpm qa:cloudflare-runtime
          mkdir -p release/worker release/assets
          corepack pnpm --filter @alvo/web exec wrangler deploy --dry-run --outdir "$GITHUB_WORKSPACE/release/worker"
          cp -R apps/web/.open-next/assets/. release/assets/
      - if: matrix.target == 'web'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alvo-security-release
          path: release/
          retention-days: 1
      - if: matrix.target == 'lp'
        run: corepack pnpm --filter @alvo/lp build
      - if: matrix.target == 'mobile'
        run: corepack pnpm --filter @alvo/mobile exec expo export --platform ios --platform android --output-dir /tmp/alvo-mobile-export
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec firebase emulators:exec --only auth,firestore,storage --project demo-alvo-qa 'node scripts/qa-ci.mjs'
